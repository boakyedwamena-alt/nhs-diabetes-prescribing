name: CI
on: [push, pull_request]
jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg2://nhs:nhs@localhost:5432/nhs_diabetes
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nhs
          POSTGRES_PASSWORD: nhs
          POSTGRES_DB: nhs_diabetes
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nhs" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: End-to-end run on synthetic demo data
        run: make demo
